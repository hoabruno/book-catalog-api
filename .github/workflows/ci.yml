name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, pdo_sqlite, pdo_mysql, redis
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (Larastan level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, pdo_sqlite, pdo_mysql, redis
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Tests
        run: php artisan test
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_DATABASE: ${{ matrix.database == 'mysql' && 'testing' || ':memory:' }}
          DB_USERNAME: root
          DB_PASSWORD: root
